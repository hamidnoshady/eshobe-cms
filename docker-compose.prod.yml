services:
  web:
    build:
      context: .
      args:
        # Inlined into client bundles and the CSP frame-ancestors header at
        # build time — runtime env alone cannot set NEXT_PUBLIC_* values.
        NEXT_PUBLIC_SERVER_URL: https://${CONTROL_PLANE_HOST:?set CONTROL_PLANE_HOST}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?set PREVIEW_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://${CONTROL_PLANE_HOST}
      # Media storage is configured by a superadmin in the admin UI
      # (storage-connections), not through environment variables.
      # The jobs cron lives in this container, which is only correct while there is
      # exactly one replica. Scaling `web` means setting this to false and running
      # `payload jobs:run` in a container of its own — two replicas both run every
      # scheduled publish, and nothing errors when they do.
      JOBS_AUTORUN: ${JOBS_AUTORUN:-true}
      # WAVE-11 — where this process writes the Caddy theme-routes map after every
      # routing-affecting deployment transition (src/deploy/routing.ts). Inside the
      # `theme_routes` volume below, which Caddy mounts read-only and watches.
      THEME_ROUTES_FILE: ${THEME_ROUTES_FILE:-/app/theme-routes/theme-routes.caddy}
    expose:
      - '3000'
    # One replica. `deploy.replicas` here would double every scheduled publish —
    # see JOBS_AUTORUN above.
    scale: 1
    volumes:
      # Customer uploads (Media.staticDir = MEDIA_DIR = /app/media). Without a
      # volume every redeploy deletes every uploaded file.
      - media_uploads:/app/media
      # Seeded from the image on first use with the committed empty map.
      - theme_routes:/app/theme-routes
    healthcheck:
      # Any HTTP response counts: the ask endpoint 404s without a domain param,
      # which still proves the server is up and able to answer Caddy.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/domain-check').then(() => process.exit(0), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # Apply migrations separately before starting web (see README); allow cold startup.
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eshobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eshobe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eshobe} -d ${POSTGRES_DB:-eshobe}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # The image's default command plus `--watch`: Caddy re-adapts the Caddyfile —
    # imports included — every second and reloads when the result changes, which is
    # how a regenerated theme-routes map takes effect with no Docker socket, no admin
    # API exposed on the network and no `docker exec`. The map is written atomically,
    # so a poll never reads half a file; a file that failed to adapt would stop the
    # watcher (not Caddy), which is why the renderer refuses malformed hostnames.
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile', '--watch']
    ports:
      - '80:80'
      - '443:443'
    environment:
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:?set CONTROL_PLANE_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # WAVE-11 §5 — the host → theme-upstream map the Caddyfile imports, written by
      # `web` (THEME_ROUTES_FILE). A directory volume, not a bind-mounted file: the map
      # is replaced by rename, and a single-file bind mount pins the *old* inode, so
      # Caddy would keep reading the map from before the first regeneration forever.
      # `web` starts first (depends_on below) and seeds the volume with the committed
      # empty map — a missing import is a Caddy that will not boot.
      - theme_routes:/etc/caddy/theme-routes:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        # Not just ordering: Caddy's on-demand `ask` needs web answering, or the
        # first TLS handshakes after a deploy are refused certificates.
        condition: service_healthy
volumes:
  pgdata:
  media_uploads:
  theme_routes:
  caddy_data:
  caddy_config:
