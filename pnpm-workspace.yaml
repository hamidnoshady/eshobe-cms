packages:
  - 'packages/*'

# pnpm 11 reads build-script approvals here, not from package.json.
# sharp: image resizing. esbuild / unrs-resolver: native binaries.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  '@payloadcms/ui@3.90.2': patches/@payloadcms__ui@3.90.2.patch
