# The full checklist, run automatically.
#
# This workflow used to be `workflow_dispatch`-only, on the theory that a
# contributor runs the same checks locally. In practice nothing verified that,
# so a branch could merge with a red suite and the only gate in front of the
# published image was lint/typecheck/build. It now runs on every pull request,
# and — the important part — `publish.yml` calls it through `workflow_call` as
# its own gate and will not build, push or deploy an image until every job here
# is green. There is exactly one definition of "the tests pass", and both the
# PR check and the deployment use it.
#
# Every suite the repository has runs here:
#   lint · typecheck · build · docker image + srv1 compose/migration smoke ·
#   Vitest integration suites · ownership replay · Playwright e2e
#
# `ci-success` is the single aggregate job to require in branch protection: it
# fails if any job above it failed or was skipped, so adding a new job cannot
# silently fall outside the gate.
name: CI

on:
  pull_request:
  # Not `push: branches: [main]`. A merge to `main` starts publish.yml, which
  # calls this workflow through `workflow_call` as its gate — adding a push
  # trigger here would run the whole suite (two Postgres services, a Docker
  # build and Playwright) a second time on the same commit for no extra signal.
  # `main` is still covered on every merge, via publish.yml.
  workflow_dispatch:
  workflow_call:

concurrency:
  # Supersede an in-flight run for the same pull request (a force-push during
  # review), but never cancel a called run: that one is what publish.yml is
  # waiting on, and cancelling it would block a deploy on a phantom failure.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Turn a stray `console.log`-grade warning in pnpm into nothing, and keep the
  # store deterministic across jobs.
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ---------- Quick static checks (no DB required) ----------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ---------- Build the Next.js app (catches build-time breaks) ----------
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # `next build` loads payload.config.ts; these placeholders are enough for the
      # build step — nothing prerenders from the DB. Mirrors Dockerfile.
      DATABASE_URL: postgres://build:build@localhost:5432/build
      PAYLOAD_SECRET: build-time-placeholder
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Payload import map
        run: pnpm generate:importmap
      - name: Fail if the committed import map is stale
        # `generate:importmap` rewrites src/app/(payload)/admin/importMap.js. A
        # contributor who adds an admin component and forgets to regenerate it
        # gets a working local dev server (Payload regenerates on boot) and a
        # broken admin in the image, which builds from the committed file.
        run: git diff --exit-code -- 'src/app/(payload)/admin/importMap.js'
      - name: Build
        run: pnpm build

  # ---------- Docker image build + srv1 deployment acceptance ----------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (do not push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: eshobe-cms-web
          build-args: |
            NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify srv1 migration gate and restricted runtime
        run: bash tests/deployment/compose-smoke.sh

  # ---------- Integration tests (Vitest + real Postgres) ----------
  test-int:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eshobe
          POSTGRES_PASSWORD: eshobe
          POSTGRES_DB: eshobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eshobe -d eshobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests boot Payload directly (getPayload) rather than going
      # through the CLI. NODE_ENV unset defaults Payload to dev/push mode, where
      # it auto-syncs the schema on first init — no manual migrate step needed.
      DATABASE_URL: postgres://eshobe:eshobe@127.0.0.1:5432/eshobe
      PAYLOAD_SECRET: ci-test-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      PREVIEW_SECRET: ci-preview-secret
      PAYMENT_GATEWAY_SKIP_DNS: 'true'
      PAYMENT_GATEWAY_ALLOW_INSECURE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Payload import map
        run: pnpm generate:importmap
      - name: Seed database (pushes schema via Payload dev mode + writes seed data)
        run: pnpm seed
      - name: Vitest integration suites
        run: pnpm test:int
      - name: Ownership replay (normalisation + gate on a scratch database)
        run: pnpm exec tsx tests/deployment/ownership.ts

  # ---------- End-to-end tests (Playwright against `pnpm dev`) ----------
  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eshobe
          POSTGRES_PASSWORD: eshobe
          POSTGRES_DB: eshobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eshobe -d eshobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `pnpm dev` runs in dev mode (NODE_ENV=development) so Payload pushes the
      # schema on first boot — no manual migrate step needed.
      DATABASE_URL: postgres://eshobe:eshobe@127.0.0.1:5432/eshobe
      PAYLOAD_SECRET: ci-test-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      PREVIEW_SECRET: ci-preview-secret
      PAYMENT_GATEWAY_SKIP_DNS: 'true'
      PAYMENT_GATEWAY_ALLOW_INSECURE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium
      - name: Generate Payload import map
        run: pnpm generate:importmap
      - name: Seed database (schema pushed by Payload dev-mode on first init)
        run: pnpm seed
      - name: Playwright e2e suites
        run: pnpm test:e2e
        env:
          CI: 'true'
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ---------- The one gate ----------
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, typecheck, build, docker-build, test-int, test-e2e]
    steps:
      # `needs.*.result` is checked explicitly rather than relying on job
      # ordering: a cancelled or skipped dependency is not a pass, and
      # publish.yml treats this job's result as permission to deploy.
      - name: Fail unless every job succeeded
        # The expression's string literal must be SINGLE-quoted: GitHub's
        # expression syntax has no double-quoted string, and a `" "` here is not
        # a lint warning — it fails to parse the whole workflow file, producing a
        # run with no jobs and the unhelpful "workflow file issue" error.
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for result in $results; do
            if [ "$result" != success ]; then
              echo "::error::A required CI job did not succeed ($results)."
              exit 1
            fi
          done
          echo 'All CI jobs succeeded.'
