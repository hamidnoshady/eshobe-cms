# Manual-only copy of the checklist a contributor runs locally (lint, typecheck,
# build, integration tests, E2E, and the srv1 Compose/migration gate). It does
# NOT run on a pull request, on a push to main, or after a merge — start it from
# the Actions tab (workflow_dispatch) when you want a run.
#
# Deployment is deliberately NOT affected by this. `publish.yml` still runs on
# every push to main: it re-runs lint/typecheck/build as its own `gates` job and
# then pushes the image to GHCR, which is what the srv1 Komodo stack pulls
# (through the ghcr-mirror.liara.ir cache — see docker-compose.srv1.yml). So a
# merge still produces a deployable image with its own gate in front of it;
# what stops happening automatically is this checklist.
#
# What follows from that: run the checklist yourself before every commit, and
# don't report a change as done on the strength of a run nobody dispatched.
name: CI

on:
  workflow_dispatch:

concurrency:
  # Manual runs only, so there is no PR superseding to cancel: let each
  # dispatched run finish.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------- Quick static checks (no DB required) ----------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ---------- Build the Next.js app (catches build-time breaks) ----------
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # `next build` loads payload.config.ts; these placeholders are enough for the
      # build step — nothing prerenders from the DB. Mirrors Dockerfile.
      DATABASE_URL: postgres://build:build@localhost:5432/build
      PAYLOAD_SECRET: build-time-placeholder
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Payload import map
        run: pnpm generate:importmap
      - name: Build
        run: pnpm build

  # ---------- Docker image build (verifies Dockerfile stays green) ----------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (do not push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: eshobe-cms-web
          build-args: |
            NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify srv1 migration gate and restricted runtime
        run: bash tests/deployment/compose-smoke.sh

  # ---------- Integration tests (Vitest + real Postgres) ----------
  test-int:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eshobe
          POSTGRES_PASSWORD: eshobe
          POSTGRES_DB: eshobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eshobe -d eshobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests boot Payload directly (getPayload) rather than going
      # through the CLI. NODE_ENV unset defaults Payload to dev/push mode, where
      # it auto-syncs the schema on first init — no manual migrate step needed.
      DATABASE_URL: postgres://eshobe:eshobe@127.0.0.1:5432/eshobe
      PAYLOAD_SECRET: ci-test-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      PREVIEW_SECRET: ci-preview-secret
      PAYMENT_GATEWAY_SKIP_DNS: 'true'
      PAYMENT_GATEWAY_ALLOW_INSECURE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Payload import map
        run: pnpm generate:importmap
      - name: Seed database (pushes schema via Payload dev mode + writes seed data)
        run: pnpm seed
      - name: Vitest integration suites
        run: pnpm test:int
      - name: Ownership replay (normalisation + gate on a scratch database)
        run: pnpm exec tsx tests/deployment/ownership.ts

  # ---------- End-to-end tests (Playwright against `pnpm dev`) ----------
  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [build] # Build step is proof the app compiles; reuse its deps via cache
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eshobe
          POSTGRES_PASSWORD: eshobe
          POSTGRES_DB: eshobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eshobe -d eshobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `pnpm dev` runs in dev mode (NODE_ENV=development) so Payload pushes the
      # schema on first boot — no manual migrate step needed.
      DATABASE_URL: postgres://eshobe:eshobe@127.0.0.1:5432/eshobe
      PAYLOAD_SECRET: ci-test-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      PREVIEW_SECRET: ci-preview-secret
      PAYMENT_GATEWAY_SKIP_DNS: 'true'
      PAYMENT_GATEWAY_ALLOW_INSECURE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium
      - name: Generate Payload import map
        run: pnpm generate:importmap
      - name: Seed database (schema pushed by Payload dev-mode on first init)
        run: pnpm seed
      - name: Playwright e2e suites
        run: pnpm test:e2e
        env:
          CI: 'true'
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
