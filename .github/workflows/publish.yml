name: Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Allow manual re-runs / republishing without a new commit.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- Re-run the quick gates on the exact merge commit ----------
  gates:
    name: Pre-publish gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      PAYLOAD_SECRET: build-time-placeholder
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm generate:importmap
      - run: pnpm build

  # ---------- Docker image: build & push to GHCR ----------
  docker-publish:
    name: Publish Docker image (GHCR)
    runs-on: ubuntu-latest
    needs: [gates]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL || 'http://localhost:3000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Trigger Coolify redeploy
        run: |
          curl -sf -X POST \
            "https://manage.eshobe.com/api/v1/services/ltabipqxfaajai7jeuc3g5eb/restart?latest=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
