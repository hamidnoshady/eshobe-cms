name: Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Allow manual re-runs / republishing without a new commit.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- Re-run the quick gates on the exact merge commit ----------
  gates:
    name: Pre-publish gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      PAYLOAD_SECRET: build-time-placeholder
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm generate:importmap
      - run: pnpm build

  # ---------- Docker image: build & push to GHCR ----------
  docker-publish:
    name: Publish Docker image (GHCR)
    runs-on: ubuntu-latest
    needs: [gates]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL || 'http://localhost:3000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ---------- Publish workspace npm package(s) ----------
  #
  # `packages/site-runtime` ships as @eshobe/site-runtime (its
  # publishConfig.access = public). Requires an npm Automation token with
  # publish access to the @eshobe scope stored as the NPM_TOKEN repo secret.
  # Every push to main publishes a prerelease (0.1.0-dev.<sha>); pushing a
  # `vX.Y.Z` tag publishes that exact version as the stable release.
  npm-publish:
    name: Publish @eshobe/site-runtime to npm
    runs-on: ubuntu-latest
    needs: [gates]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            PKG_VER=$(node -p "require('./packages/site-runtime/package.json').version")
            echo "version=${PKG_VER}-dev.${SHA}" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package version for prerelease
        if: steps.version.outputs.tagged == 'false'
        run: |
          cd packages/site-runtime
          npm version --no-git-tag-version ${{ steps.version.outputs.version }}

      - name: Publish to npm
        working-directory: packages/site-runtime
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
