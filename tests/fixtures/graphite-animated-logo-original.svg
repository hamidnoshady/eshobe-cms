<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" width="1280" height="720">
  <title id="title">Graphite Architecture Office — constructed logo animation</title>
  <desc id="desc">The original Graphite architectural cube is assembled from drafting lines with short tracing streaks, subtle motion blur, a navy structural reveal, and typographic fade-in.</desc>
  <defs>
    <filter id="motionSmear" x="-35%" y="-40%" width="170%" height="180%">
      <feGaussianBlur stdDeviation="3.3"/>
    </filter>
    <filter id="traceBloom" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
:root{color-scheme:light dark}
svg{--ink:#f1f5f6;--navy:#56779e;--guide:#7d9abb;--beam:#d8f6ff;--word:#f6f7f7;--timing:9.6s}
/* Unmodified original mark geometry, treated as a final architectural drawing. */
.base-wires path{fill:none;stroke:var(--ink);stroke-width:6;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:ink-reveal var(--draw-time,1s) cubic-bezier(.16,.65,.3,1) var(--delay,2.3s) both}
.base-wires path:nth-child(1){--delay:2.18s;--draw-time:1.13s}
.base-wires path:nth-child(2){--delay:2.51s;--draw-time:.66s}
.base-wires path:nth-child(3){--delay:2.70s;--draw-time:.68s}
.base-wires path:nth-child(4){--delay:2.64s;--draw-time:1.13s}
.base-wires path:nth-child(5){--delay:2.91s;--draw-time:1.23s}
@keyframes ink-reveal{0%{opacity:0;stroke-dashoffset:1}1%{opacity:.8}100%{opacity:1;stroke-dashoffset:0}}

/* Lightweight sketch strokes: each parallels a real edge instead of wandering. */
.schematic{fill:none;stroke:var(--guide);stroke-linecap:square;stroke-width:1.6;opacity:1}
.schematic path{stroke-dasharray:1;stroke-dashoffset:1;animation:guide-in 1.34s cubic-bezier(.25,.65,.4,1) var(--delay,0s) both}
.schematic path:nth-child(1){--delay:.20s}
.schematic path:nth-child(2){--delay:.39s}
.schematic path:nth-child(3){--delay:.63s}
.schematic path:nth-child(4){--delay:.86s}
.schematic path:nth-child(5){--delay:1.02s}
.schematic path:nth-child(6){--delay:1.28s}
.schematic path:nth-child(7){--delay:1.52s}
.schematic path:nth-child(8){--delay:1.73s}
@keyframes guide-in{0%{opacity:0;stroke-dashoffset:1}13%{opacity:.84}56%{opacity:.72;stroke-dashoffset:0}75%{opacity:.27;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:-.08}}

/* The drawing pen is a short sharp dash, with a separate, soft trailing exposure. */
.tracers path{fill:none;stroke:var(--beam);stroke-width:4.1;stroke-linecap:round;stroke-dasharray:.16 1;stroke-dashoffset:1.18;filter:url(#traceBloom);animation:pen-pass .95s cubic-bezier(.35,.03,.42,.96) var(--delay) both;opacity:0}
.tracers path:nth-child(1){--delay:2.15s}
.tracers path:nth-child(2){--delay:2.45s}
.tracers path:nth-child(3){--delay:2.65s}
.tracers path:nth-child(4){--delay:2.70s}
.tracers path:nth-child(5){--delay:2.94s}
.trail path{fill:none;stroke:var(--beam);stroke-width:9;stroke-dasharray:.23 1;stroke-dashoffset:1.22;opacity:0;filter:url(#motionSmear);animation:pen-pass .95s cubic-bezier(.35,.03,.42,.96) var(--delay) both}
.trail path:nth-child(1){--delay:2.10s}.trail path:nth-child(2){--delay:2.40s}.trail path:nth-child(3){--delay:2.60s}.trail path:nth-child(4){--delay:2.65s}.trail path:nth-child(5){--delay:2.89s}
@keyframes pen-pass{0%{stroke-dashoffset:1.2;opacity:0}12%{opacity:.75}65%{opacity:.8}96%{opacity:.1}100%{stroke-dashoffset:-.34;opacity:0}}

/* Each dark structural panel wipes into precisely the existing original coordinates. */
.struct-panels path{fill:var(--navy);opacity:0;animation:wipe-in .83s cubic-bezier(.22,.65,.3,1) var(--panel-delay,3.55s) both}
.struct-panels path:nth-child(1){--panel-delay:3.42s;clip-path:inset(0 100% 0 0);--clip-start:inset(0 100% 0 0)}
.struct-panels path:nth-child(2){--panel-delay:3.64s;clip-path:inset(100% 0 0 0);--clip-start:inset(100% 0 0 0)}
.struct-panels path:nth-child(3){--panel-delay:3.88s;clip-path:inset(0 100% 0 0);--clip-start:inset(0 100% 0 0)}
@keyframes wipe-in{0%{opacity:1;clip-path:var(--clip-start)}100%{opacity:1;clip-path:inset(-3% -3% -3% -3%)}}

/* Secondary drafting flashes travel past the navy edges then evaporate. */
.edge-flashes path{fill:none;stroke:var(--beam);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:.20 1;stroke-dashoffset:1.2;filter:url(#traceBloom);animation:pen-pass .92s ease-out var(--delay) both}
.edge-flashes path:nth-child(1){--delay:3.42s}.edge-flashes path:nth-child(2){--delay:3.68s}.edge-flashes path:nth-child(3){--delay:3.92s}

.origin{fill:var(--ink);opacity:0;animation:dot-pop .36s ease-out 2.54s both}
@keyframes dot-pop{0%{opacity:0;r:0}55%{opacity:1;r:5}100%{opacity:1;r:3}}
.mark-word{fill:var(--word);opacity:0;animation:type-arrive .95s cubic-bezier(.2,.65,.28,1) 4.77s both}
@keyframes type-arrive{0%{opacity:0;transform:translateY(12px);filter:blur(5px)}60%{opacity:1;filter:blur(.5px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
.subtitle-lines{fill:none;stroke:var(--word);stroke-width:3.3}
.subtitle-lines path{stroke-dasharray:1;stroke-dashoffset:1;animation:ink-reveal .48s ease-out 5.48s both}
.arch-caption{fill:var(--word);opacity:0;animation:caption-arrive .78s ease-out 5.60s both}
@keyframes caption-arrive{0%{opacity:0;transform:translateY(7px);filter:blur(3px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}

/* Restrained final highlight; no endless pulsing over the finished logo. */
.final-sheen{stroke:var(--beam);stroke-width:1.8;stroke-linecap:round;fill:none;stroke-dasharray:.12 1;stroke-dashoffset:1.12;filter:url(#traceBloom);opacity:0;animation:pen-pass 1s ease-out 6.05s both}
@media(prefers-reduced-motion:reduce){.base-wires path,.struct-panels path,.mark-word,.origin,.subtitle-lines path,.arch-caption{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;clip-path:none!important;transform:none!important;filter:none!important}.schematic,.tracers,.trail,.edge-flashes,.final-sheen{display:none!important}}
</style>
