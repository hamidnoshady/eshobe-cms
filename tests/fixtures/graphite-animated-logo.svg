<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-labelledby="title">
  <title id="title">Graphite</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#8c6f4a"/>
    </linearGradient>
    <filter id="motionSmear" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.3 1.2" edgeMode="duplicate" result="smear"/>
    </filter>
    <filter id="traceBloom" x="-25%" y="-25%" width="150%" height="150%" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .construction {
      fill: none;
      stroke: url(#ink);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      transform-origin: 160px 60px;
      will-change: transform, opacity;
      animation: draw 1.6s cubic-bezier(.4,0,.2,1) forwards, settle 600ms ease-out 1.4s both;
    }
    .type {
      --delay: 1.15s;
      opacity: 0;
      animation-name: fade-in;
      animation-duration: 900ms;
      animation-timing-function: ease-out;
      animation-delay: var(--delay);
      animation-fill-mode: forwards;
    }
    .bloom { filter: url(#traceBloom); }
    .smear { filter: url(#motionSmear); }
    @keyframes draw {
      from { stroke-dashoffset: 220; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes settle {
      0% { transform: translateY(10px) rotate(-2deg); opacity: .35; }
      100% { transform: translateY(0) rotate(0deg); opacity: 1; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <g class="bloom" filter="url(#traceBloom)">
    <path class="construction" pathLength="1" d="M20 90 C80 20 140 20 160 60 S240 100 300 30"/>
    <circle class="smear" cx="160" cy="60" r="7" fill="url(#ink)"/>
  </g>
  <text class="type" x="160" y="110" text-anchor="middle" font-family="Vazirmatn" font-size="18" font-weight="700">GRAPHITE</text>
</svg>
