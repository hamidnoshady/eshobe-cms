# srv1.eshobe.com deployment -- the compose file Komodo deploys from.
#
# The Komodo stack `eshobe-cms` is a Git Repo stack pointed at this repo and
# branch. It no longer builds on the host: the image is the one GitHub Actions
# (.github/workflows/publish.yml) builds and pushes to GHCR on every push to
# main. Pressing Deploy in the Komodo UI pulls the latest commit for this file,
# pulls the current CI image and recreates the containers. Keep
# `project_name: eshobe-cms` on the Komodo side -- the pgdata and
# media_uploads volumes are named from it.
#
# ghcr.io itself is DPI-blocked from srv1 (TLS handshake to any ghcr.io host
# times out), so the image is pulled through the Liara GHCR pull-through cache
# at ghcr-mirror.liara.ir. Same content, same digests, reachable host. This
# requires the GHCR package to be PUBLIC -- the mirror has no upstream
# credentials, and a private package returns 404 through it.
#
# The tag is written out literally on purpose. Komodo's "update available"
# check resolves the image reference straight out of this file WITHOUT compose
# variable interpolation, so a `${TAG:-latest}` here makes the registry lookup
# fail and the Update button never appears in the UI.
#
# NEXT_PUBLIC_* values are baked into the client bundle at BUILD time, so the
# real origin comes from the repository variable NEXT_PUBLIC_SERVER_URL
# (https://cms.eshobe.com), read by the publish workflow. Changing the runtime
# env below is not enough -- the variable has to be right when CI builds.
#
# No secrets here: all environment values are ${VAR} references, and Komodo
# writes the real values into a .env beside this file at deploy time. Never
# use env_file on web: MIGRATE_DATABASE_URL must only reach the one-shot job.
# Komodo logs resolved compose config in plaintext; rotate that credential too.
#
# Do NOT use docker-compose.prod.yml's bundled
# `caddy` service here -- it binds host 80/443, which belongs to
# OpenLiteSpeed/DirectAdmin on this box and must never be taken by a
# container (see /root/CLAUDE.md). Real customer-domain on-demand TLS (the
# app's own Caddyfile) is out of scope for this deployment: only the
# control-plane host is exposed, reverse-proxied by DirectAdmin -> the shared
# host Caddy at /opt/caddy -> web on 127.0.0.1:3001.
name: eshobe-cms

services:
  web:
    # One CI-built image, shared by web and migrate. Literal tag -- see header.
    image: ghcr-mirror.liara.ir/hamidnoshady/eshobe-cms:latest
    # Always re-pull so Deploy actually moves to the newest CI image rather
    # than silently reusing a cached :latest.
    pull_policy: always
    restart: unless-stopped
    mem_limit: 512m # security audit 2026-09-05: cap so one
    pids_limit: 256 # container cannot OOM the host and take
    memswap_limit: 512m # the live DirectAdmin sites down with it
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set restricted DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?set PREVIEW_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://${CONTROL_PLANE_HOST}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      JOBS_AUTORUN: ${JOBS_AUTORUN:-true}
    ports:
      - '127.0.0.1:3001:3000'
    scale: 1
    volumes:
      - media_uploads:/app/media
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/domain-check').then((r) => process.exit(r.status === 404 ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  migrate:
    # Byte-identical to web: same image reference, same tag, one pull.
    image: ghcr-mirror.liara.ir/hamidnoshady/eshobe-cms:latest
    pull_policy: always
    working_dir: /app/migrator
    command: ['node', 'node_modules/payload/bin.js', 'run', 'scripts/migrate.ts']
    restart: 'no'
    mem_limit: 512m
    pids_limit: 256
    memswap_limit: 512m
    security_opt:
      - no-new-privileges:true
    environment:
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:?set privileged MIGRATE_DATABASE_URL}
      # The runtime role that must own schema public after migrating (the
      # DATABASE_URL username on srv1). The migrator never receives DATABASE_URL
      # itself; without this it cannot know the role and refuses to run.
      APP_DATABASE_ROLE: ${APP_DATABASE_ROLE:?set APP_DATABASE_ROLE (runtime role, e.g. the DATABASE_URL username)}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://${CONTROL_PLANE_HOST}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m # security audit 2026-09-05: cap so one
    pids_limit: 128 # container cannot OOM the host and take
    memswap_limit: 384m # the live DirectAdmin sites down with it
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eshobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eshobe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eshobe} -d ${POSTGRES_DB:-eshobe}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  media_uploads:
